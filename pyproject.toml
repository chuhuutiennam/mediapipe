[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "mediapipe-video"
version = "1.0.1"
description = "MediaPipe SelfieSegmenter gRPC worker for video background segmentation"
requires-python = ">=3.10"
dependencies = [
    "mediapipe==0.10.35",
    "grpcio==1.81.1",
    "grpcio-tools==1.81.1",
    "protobuf==6.33.6",
    "numpy==2.4.6",
    "opencv-contrib-python>=4.5",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.19",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
mediapipe-video = "mediapipe_video.server:main"

# ---------------------------------------------------------------------------
# setuptools — src layout
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mediapipe_video = ["video.proto"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mediapipe_video"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.10"
strict                 = false
ignore_missing_imports = true
mypy_path              = "src"
exclude                = ["tests/", "\\.venv/"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["mediapipe_video"]
omit   = ["mediapipe_video/__main__.py"]

[tool.coverage.report]
show_missing = true
